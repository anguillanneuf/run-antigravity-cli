name: 'Antigravity Self-Testing Workflow'

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read       # Required for checking out code
  pull-requests: write # Required for posting inline review comments
  id-token: write      # Required for requesting JWT OICD token from Google Cloud OIDC Workload Identity Federation

jobs:
  remove-stale-approval:
    name: 'Reset Stale Approval on Push'
    permissions:
      pull-requests: write
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    steps:
      - name: Remove safe-to-test label on new commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Untrusted fork PR push detected. Removing stale 'safe-to-test' approval label."
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "safe-to-test" || echo "Label already removed"

  code-review:
    name: 'Google Antigravity Code Review'
    timeout-minutes: 15
    # Gating:
    # 1. Internal PRs from trusted authors run via pull_request.
    # 2. Fork PRs from trusted authors run via pull_request_target.
    # 3. Fork PRs from untrusted authors run ONLY when explicitly labeled 'safe-to-test' (no TOCTOU on synchronize).
    # 4. PR reviews can also be triggered via '/review' comment by repository maintainers.
    if: |
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.draft == false &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          github.event.pull_request.draft == false &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          github.event.pull_request.draft == false &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'safe-to-test'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '/review') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    steps:
      # For untrusted fork PRs, checkout trusted base branch to run the review action (uses: ./).
      # The review engine fetches the PR diff directly via GitHub API and does not need untrusted code checked out.
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) && (github.base_ref || github.event.repository.default_branch) || (github.event.pull_request.head.sha || github.sha) }}
          allow-unsafe-pr-checkout: true

      # -------------------------------------------------------------------------
      # Authenticate to Google Cloud via Workload Identity Federation (OIDC)
      # -------------------------------------------------------------------------
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Run Antigravity Review Agent
        uses: ./
        with:
          gcp-project-id: ${{ vars.GCP_PROJECT_ID }}
          gcp-location: ${{ vars.GCP_LOCATION || 'global' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          fail-on-error: true
          custom-prompt: |
            Please analyze the following pull request with extreme care. Focus on:
            1. Security vulnerabilities (OWASP Top 10, credential leaks, unsafe imports).
            2. Code quality, optimization, and potential bugs.
            3. Do not suggest downgrading modern dependency or GitHub Action versions (e.g. actions/checkout@v7, google-github-actions/auth@v3).
            4. Ensure suggestion blocks are strictly correct and actionable.
