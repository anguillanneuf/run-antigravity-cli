name: 'CodeMender Security Scan Workflow'

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan mode: diff (native Git diff + caller/callee impact), full (directory scope), or deep (exhaustive audit)'
        required: false
        default: 'diff'
        type: choice
        options:
          - diff
          - full
          - deep
      dry_run:
        description: 'Run in dry-run preflight mode (validate install and auth)'
        required: false
        default: false
        type: boolean
      model:
        description: 'CodeMender backend model tier'
        required: false
        default: 'gemini-3.5-flash'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read       # Required for checking out code
  pull-requests: write # Required for posting scan report comments on PRs
  id-token: write      # Required for requesting OIDC token for Workload Identity Federation

jobs:
  remove-stale-approval:
    name: 'Reset Stale Approval on Push'
    permissions:
      pull-requests: write
    if: |
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["synchronize", "reopened"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    steps:
      - name: Remove safe-to-test label on new commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Untrusted fork PR push detected. Removing stale 'safe-to-test' approval label."
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "safe-to-test" || echo "Label already removed"

  codemender-scan:
    name: 'Google CodeMender Security Scan'
    timeout-minutes: 15
    # Gating:
    # 1. Manual dispatch always allowed.
    # 2. Internal PRs from trusted authors run via pull_request.
    # 3. Fork PRs from trusted authors run via pull_request_target.
    # 4. Fork PRs from untrusted authors run ONLY when explicitly labeled 'safe-to-test' (no TOCTOU on synchronize).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.draft == false &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          github.event.pull_request.draft == false &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          github.event.pull_request.draft == false &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'safe-to-test'
        )
      )
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION || 'us-central1' }}
    steps:
      # Checkout trusted scripts from base repository into .trusted-ci to prevent executing
      # attacker-tampered scripts from untrusted fork PR commits.
      - name: Checkout Trusted CI Scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}
          path: .trusted-ci
          sparse-checkout: |
            scripts

      - name: Relocate Trusted CI Scripts
        run: |
          if [ ! -d ".trusted-ci/scripts" ]; then
            echo "::error::Trusted CI scripts not found at .trusted-ci/scripts; refusing to fall back to untrusted workspace scripts."
            exit 1
          fi
          mv .trusted-ci "$RUNNER_TEMP/trusted-ci"
          echo "CI_SCRIPTS_DIR=$RUNNER_TEMP/trusted-ci/scripts" >> "$GITHUB_ENV"

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # -------------------------------------------------------------------------
      # Authenticate to Google Cloud via Workload Identity Federation (OIDC)
      # -------------------------------------------------------------------------
      - name: Authenticate to Google Cloud (OIDC)
        id: gcp-auth
        uses: google-github-actions/auth@v3
        continue-on-error: ${{ inputs.dry_run == true }}
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      # -------------------------------------------------------------------------
      # Cache and Install CodeMender CLI
      # -------------------------------------------------------------------------
      - name: Cache CodeMender CLI
        id: cache-cm
        uses: actions/cache@v4
        with:
          path: /tmp/cm-bin/cm
          key: cm-cli-linux-amd64-stable-v1

      - name: Install CodeMender CLI
        run: |
          if [ "${{ steps.cache-cm.outputs.cache-hit }}" != "true" ]; then
            echo "Downloading CodeMender CLI from Google Artifact Registry..."
            mkdir -p /tmp/cm-dl /tmp/cm-bin
            curl -fsSL -o /tmp/cm-dl/cm.zip \
              "https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media"
            unzip -q -o /tmp/cm-dl/cm.zip -d /tmp/cm-bin
          fi
          sudo cp /tmp/cm-bin/cm /usr/local/bin/cm
          sudo chmod +x /usr/local/bin/cm
          cm --version || echo "cm installed successfully"

      # -------------------------------------------------------------------------
      # Initialize Workspace & Generate CI Config
      # -------------------------------------------------------------------------
      - name: Initialize CodeMender Workspace
        id: cm-init
        continue-on-error: ${{ inputs.dry_run == true }}
        run: |
          cm init || echo "cm init completed with exit code $?"

      - name: Generate Headless CodeMender CI Config
        run: |
          mkdir -p ~/.codemender .codemender
          python3 "$CI_SCRIPTS_DIR/setup_cm_config.py" \
            --output ~/.codemender/config.yaml \
            --model "${{ inputs.model || 'gemini-3.5-flash' }}" \
            --project-id "${{ vars.GCP_PROJECT_ID }}" \
            --location "${{ vars.GCP_LOCATION || 'us-central1' }}" \
            --project-paths "." \
            --sync-workspace

      # -------------------------------------------------------------------------
      # Resolve Changed Files & Run Scan
      # -------------------------------------------------------------------------
      - name: Resolve Target Scan Files
        id: resolve-files
        env:
          SCAN_MODE: ${{ inputs.scan_mode || 'diff' }}
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          FLAGS="--output-github-env --absolute"
          if [ "$SCAN_MODE" = "full" ] || [ "$SCAN_MODE" = "deep" ]; then
            FLAGS="$FLAGS --full"
          else
            DIFF_TARGET="origin/$BASE_REF"
            if ! git rev-parse --verify "$DIFF_TARGET" >/dev/null 2>&1; then
              if git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
                DIFF_TARGET="$BASE_REF"
              else
                DIFF_TARGET="HEAD~1"
              fi
            fi
            FLAGS="$FLAGS --base-ref $DIFF_TARGET --head-ref HEAD"
          fi
          python3 "$CI_SCRIPTS_DIR/resolve_pr_files.py" $FLAGS

      - name: Execute CodeMender Scan (cm find)
        id: cm-scan
        env:
          SCAN_MODE: ${{ inputs.scan_mode || 'diff' }}
          FILES: ${{ steps.resolve-files.outputs.files }}
          FILE_COUNT: ${{ steps.resolve-files.outputs.file_count || '0' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -f
          echo "Starting CodeMender scan (Mode: $SCAN_MODE, Files count: $FILE_COUNT, Dry-run: $DRY_RUN)"
          
          SCAN_EXIT_CODE=0
          > scan_output.log
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry-run preflight mode enabled. Skipping live backend invocation." | tee scan_output.log
          elif [ "$SCAN_MODE" = "diff" ] && [ "$FILE_COUNT" -eq 0 ]; then
            echo "No supported code files changed in this PR. Skipping scan." | tee scan_output.log
          else
            if [ "$SCAN_MODE" = "diff" ]; then
              # Determine base ref for diff mode with impact analysis
              DIFF_TARGET="origin/$BASE_REF"
              if ! git rev-parse --verify "$DIFF_TARGET" >/dev/null 2>&1; then
                if git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
                  DIFF_TARGET="$BASE_REF"
                else
                  DIFF_TARGET="HEAD~1"
                fi
              fi
              echo "Executing CodeMender native diff scan against $DIFF_TARGET (diff hunks + caller/callee impact analysis)..." | tee -a scan_output.log
              cm find . \
                --diff="$DIFF_TARGET" \
                --diff-workers=4 \
                --fail-on="CRITICAL,HIGH" \
                --sandbox=false \
                --yes 2>&1 | tee -a scan_output.log || SCAN_EXIT_CODE=$?
            elif [ "$SCAN_MODE" = "deep" ]; then
              echo "Executing CodeMender exhaustive deep scan across entire repository..." | tee -a scan_output.log
              cm find . \
                --deep \
                --deep-workers=8 \
                --fail-on="CRITICAL,HIGH" \
                --sandbox=false \
                --yes 2>&1 | tee -a scan_output.log || SCAN_EXIT_CODE=$?
            else
              echo "Executing CodeMender full scan..." | tee -a scan_output.log
              cm find . \
                --fail-on="CRITICAL,HIGH" \
                --sandbox=false \
                --yes 2>&1 | tee -a scan_output.log || SCAN_EXIT_CODE=$?
            fi
          fi

          echo "scan_exit_code=$SCAN_EXIT_CODE" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------------
      # Format Results & Publish Summary / PR Comment
      # -------------------------------------------------------------------------
      - name: Publish CodeMender Scan Report
        if: always()
        env:
          SCAN_EXIT_CODE: ${{ steps.cm-scan.outputs.scan_exit_code || '1' }}
          FILES: ${{ steps.resolve-files.outputs.files }}
          SCAN_MODE: ${{ inputs.scan_mode || 'diff' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -f
          EXTRA_ARGS=()
          if [ "$DRY_RUN" = "true" ] || [ "$DRY_RUN" = "True" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi
          python3 "$CI_SCRIPTS_DIR/report_cm_results.py" \
            --output-file scan_output.log \
            --exit-code "${SCAN_EXIT_CODE:-1}" \
            --files $FILES \
            --scan-mode "$SCAN_MODE" \
            "${EXTRA_ARGS[@]}" \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER"

