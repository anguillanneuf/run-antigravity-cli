name: 'Run Antigravity CLI'
description: 'Automate code reviews, security scans, and PR gating using the Google Antigravity CLI and Python SDK'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  api-key:
    description: 'Gemini API Key for authentication (optional if using Workload Identity Federation)'
    required: false
  workload-identity-provider:
    description: 'GCP Workload Identity Provider resource name for keyless authentication'
    required: false
  service-account:
    description: 'GCP Service Account email to impersonate when using Workload Identity Federation'
    required: false
  github-token:
    description: 'GitHub token for reading PR changes and posting comments'
    required: true
    default: '${{ github.token }}'
  gcp-project-id:
    description: 'GCP project ID for OIDC authentication (optional if using API key)'
    required: false
  gcp-location:
    description: 'GCP location for OIDC authentication (optional if using API key)'
    required: true
    default: 'global'
  custom-prompt:
    description: 'Custom instructions/prompt to guide the AI reviewer'
    required: false
  fail-on-error:
    description: 'Whether to fail the workflow run if the review agent encounters an error'
    required: false
    default: 'false'
  max-diff-lines:
    description: 'Maximum number of modified lines allowed in PR diff before skipping review to avoid resource exhaustion'
    required: false
    default: '2000'
  max-diff-files:
    description: 'Maximum number of modified files allowed in PR diff before skipping review to avoid resource exhaustion'
    required: false
    default: '50'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ${{ github.action_path }}/requirements.txt

    - name: Run Antigravity Review Agent
      shell: bash
      env:
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.workload-identity-provider }}
        INPUT_SERVICE_ACCOUNT: ${{ inputs.service-account }}
        INPUT_GCP_PROJECT_ID: ${{ inputs.gcp-project-id }}
        INPUT_GCP_LOCATION: ${{ inputs.gcp-location }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_CUSTOM_PROMPT: ${{ inputs.custom-prompt }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
        INPUT_MAX_DIFF_FILES: ${{ inputs.max-diff-files }}
        PYTHONPATH: ${{ github.action_path }}
        GEMINI_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        python ${{ github.action_path }}/src/entrypoint.py
